# Ported from ~/.config/wezterm/wezterm.lua

# Terminal / colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -sg escape-time 10
set -g focus-events on
set -g mouse on
set -g history-limit 5000
set -g set-clipboard on

# Windows (tabs) start at 1 so prefix+1..9 matches wezterm
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Leader is ctrl+a. Press it twice to send ctrl+a to the shell.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# Copy mode (vi keys, copies to system clipboard via OSC 52)
setw -g mode-keys vi
bind c copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Panes
bind '"' split-window -v -c "#{pane_current_path}"
bind . split-window -h -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind z resize-pane -Z
bind s rotate-window -D
bind w choose-tree -Zs

# Resize mode: prefix+v, then hjkl repeatedly, Escape/Enter to leave
bind v switch-client -T resize_pane
bind -T resize_pane h resize-pane -L 1 \; switch-client -T resize_pane
bind -T resize_pane j resize-pane -D 1 \; switch-client -T resize_pane
bind -T resize_pane k resize-pane -U 1 \; switch-client -T resize_pane
bind -T resize_pane l resize-pane -R 1 \; switch-client -T resize_pane
bind -T resize_pane Escape switch-client -T root
bind -T resize_pane Enter switch-client -T root

# Tabs (tmux windows)
bind t new-window -c "#{pane_current_path}"
bind [ previous-window
bind ] next-window
bind n choose-tree -Zw
bind , command-prompt -I "#W" -p "Renaming Tab Title...:" "rename-window '%%'"
bind \{ swap-window -d -t -1
bind \} swap-window -d -t +1

# Scroll
bind Up copy-mode -u
bind Down if -F "#{pane_in_mode}" "send -X page-down"

# Dim inactive panes
set -g window-style "fg=#767c9d"
set -g window-active-style "fg=#a6accd"
set -g pane-border-style "fg=#303340"
set -g pane-active-border-style "fg=#5de4c7"

# Status bar (bottom, like wezterm tab_bar_at_bottom)
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1b1e28,fg=#a6accd"
set -g message-style "bg=#303340,fg=#a6accd"

# Left: LDR when prefix active, key table name in resize mode, else session (workspace)
set -g status-left-length 40
set -g status-left "#{?client_prefix,#[fg=#bb9af7]  LDR,#{?#{||:#{==:#{client_key_table},root},#{==:#{client_key_table},}},#[fg=#f7768e]  #S,#[fg=#7dcfff]  #{client_key_table}}}#[fg=#a6accd] | "

# Right: cwd | command | time
set -g status-right-length 80
set -g status-right "󰉋  #{b:pane_current_path} | #[fg=#e0af68]  #{pane_current_command}#[fg=#a6accd] | 󰥔  %H:%M  "

setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#1b1e28,bg=#5de4c7] #I:#W "
